services:
  postgres:
    image: postgres:16
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: TaskManager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taskmanager-postgres-data:/var/lib/postgresql/data

volumes:
  taskmanager-postgres-data: